name: Update Horse Racing Data

on:
  workflow_dispatch: # Actions 탭에서 버튼 눌러 수동 실행

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 파일 자동 저장을 위한 쓰기 권한
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 마사회 데이터 수집 및 분석 실행
        env:
          KRA_API_KEY: ${{ secrets.KRA_API_KEY }}
        run: |
          python update_data.py

      - name: 결과 파일 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add race_data.json
          git commit -m "Auto update: 마사회 최신 데이터 갱신" || echo "변경사항 없음"
          git push
